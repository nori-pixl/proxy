<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Browser Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 20px; }
        .control-panel { margin-bottom: 15px; }
        input[type="text"] { width: 50%; padding: 10px; font-size: 16px; border-radius: 4px; border: none; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        /* 💡 配信画像を表示するエリア */
        .viewer-container { max-width: 1280px; margin: 0 auto; overflow: auto; border: 2px solid #444; background: #000; position: relative; }
        #screenView { width: 100%; height: auto; display: block; cursor: crosshair; }
        .loading-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; font-size: 24px; }
    </style>
</head>
<body>

    <div class="control-panel">
        <input type="text" id="urlInput" placeholder="https://youtube.com" value="https://youtube.com">
        <button onclick="navigateUrl();">接続</button>
    </div>

    <div class="viewer-container">
        <!-- 💡 Termuxから送られてきたブラウザ画像をここに表示 -->
        <img id="screenView" src="" alt="リモート画面がここに表示されます" onclick="sendClick(event);">
        <div class="loading-overlay" id="loading">読み書き中...</div>
    </div>

    <script>
        const screenView = document.getElementById('screenView');
        const loading = document.getElementById('loading');

        function toggleLoading(show) {
            loading.style.display = show ? 'flex' : 'none';
        }

        // 💡 URL送信処理
        async function navigateUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            toggleLoading(true);

            try {
                const res = await fetch('/api/navigate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const blob = await res.blob();
                screenView.src = URL.createObjectURL(blob); // 画像を画面に上書き
            } catch (err) {
                alert('通信に失敗しました。');
            } finally {
                toggleLoading(false);
            }
        }

        // 💡 画面上のクリックされた座標を計算してTermuxへ中継送信
        async function sendClick(event) {
            toggleLoading(true);

            // 表示サイズと、裏で動く本物のブラウザサイズ(1280x800)の比率を計算
            const rect = screenView.getBoundingClientRect();
            const scaleX = 1280 / rect.width;
            const scaleY = 800 / rect.height;

            const clickX = Math.round((event.clientX - rect.left) * scaleX);
            const clickY = Math.round((event.clientY - rect.top) * scaleY);

            try {
                const res = await fetch('/api/click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: clickX, y: clickY })
                });
                const blob = await res.blob();
                screenView.src = URL.createObjectURL(blob); // クリック後の最新画像に差し替え
            } catch (err) {
                console.error(err);
            } finally {
                toggleLoading(false);
            }
        }
    </script>
</body>
</html>
