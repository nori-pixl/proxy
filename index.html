<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f2f5; }
        .box { max-width: 500px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="text"] { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Web Proxy By nori-pixl</h2>
        <!-- ⚠️「あなたの独自ドメイン」の部分をご自身のドメイン（例: ://yourdomain.com）に書き換えてください -->
        <form onsubmit="event.preventDefault(); window.location.href='https://nori-pixl-proxy.onrender.com/proxy?url=' + encodeURIComponent(document.getElementById('url').value);">
            <input type="text" id="url" placeholder="https://example.com" required>
            <button type="submit">Go</button>
        </form>
    </div>
</body>
</html>
