<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 60px; background: #f0f2f5; color: #333; margin: 0; }
        .box { max-width: 500px; margin: 0 auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: opacity 0.3s; }
        input[type="text"] { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .progress-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240, 242, 245, 0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #ddd; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        .progress-text { margin-top: 20px; font-size: 18px; font-weight: bold; color: #555; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box" id="mainBox">
        <h2>Web Proxy Portal</h2>
        <form onsubmit="showProgress(event);">
            <input type="text" id="url" placeholder="https://example.com" required>
            <button type="submit">Go</button>
        </form>
    </div>
    <div class="progress-container" id="progressOverlay">
        <div class="spinner"></div>
        <div class="progress-text">Server Processing...</div>
    </div>
    <script>
        function showProgress(event) {
            event.preventDefault();
            document.getElementById('mainBox').style.opacity = '0.3';
            document.getElementById('progressOverlay').style.display = 'flex';
            
            let targetUrl = document.getElementById('url').value.trim();
            
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }
            
            // 💡 あなたの指摘通り、省略せず、エンコード（文字化け）もせず、Renderのフルドメインを完全に指定して結合します！
            window.location.href = 'https://proxy-wr.onrender.com' + targetUrl;
        }
    </script>
</body>
</html>
