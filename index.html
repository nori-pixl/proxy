<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Web Proxy</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 40px; background: #f0f2f5; color: #333; margin: 0; }
        .box { max-width: 500px; margin: 20px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .admin-box { max-width: 500px; margin: 40px auto; padding: 20px; background: #e9ecef; border-radius: 8px; font-size: 13px; text-align: left; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .progress-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240, 242, 245, 0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #ddd; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        .progress-text { margin-top: 20px; font-size: 18px; font-weight: bold; color: #555; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 1. メインのプロキシ窓 -->
    <div class="box" id="mainBox">
        <h2>Web Proxy Portal</h2>
        <form onsubmit="goProxy(event);">
            <input type="text" id="targetUrl" placeholder="https://example.com" required>
            <button type="submit">Go</button>
        </form>
    </div>

    <!-- 2. 💡 環境変数への【書き込み（URL更新）】用フォーム -->
    <div class="admin-box">
        <h3>⚙️ バックエンドURLの設定（環境変数への書き込み）</h3>
        <form onsubmit="updateEnvironment(event);">
            <label>新しいTermuxのCloudflare URL:</label>
            <input type="text" id="newTermuxUrl" placeholder="https://trycloudflare.com" required>
            <label>Render API Key (rnd_...):</label>
            <input type="password" id="apiKey" required>
            <label>Render Service ID (srv-...):</label>
            <input type="text" id="serviceId" required>
            <button type="submit" style="background:#28a745;">環境変数を書き換える</button>
        </form>
    </div>

    <!-- 進捗インジケーター -->
    <div class="progress-container" id="progressOverlay">
        <div class="spinner"></div>
        <div class="progress-text">Server Processing...</div>
    </div>

    <script>
        let cachedTermuxUrl = '';

        // 💡 画面が開いた瞬間に、Renderの環境変数からURLを【応答（取得）】する
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/get-url');
                const data = await res.json();
                cachedTermuxUrl = data.termuxUrl;
                if(cachedTermuxUrl) {
                    document.getElementById('newTermuxUrl').value = cachedTermuxUrl;
                }
            } catch (err) {
                console.error('環境変数の読み込みに失敗しました。');
            }
        });

        // プロキシへジャンプする処理
        function goProxy(event) {
            event.preventDefault();
            if (!cachedTermuxUrl) {
                alert('エラー: バックエンドURLが設定されていません。下のフォームから書き込みを行ってください。');
                return;
            }

            document.getElementById('mainBox').style.opacity = '0.3';
            document.getElementById('progressOverlay').style.display = 'flex';
            
            let url = document.getElementById('targetUrl').value.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // 環境変数から応答されたURLを使って、生の結合で直撃します
            window.location.href = cachedTermuxUrl + '/proxy?url=' + encodeURIComponent(url);
        }

        // 💡 画面から直接Renderの環境変数へ【書き込み】を行う処理
        async function updateEnvironment(event) {
            event.preventDefault();
            const newUrl = document.getElementById('newTermuxUrl').value.trim();
            const renderApiKey = document.getElementById('apiKey').value.trim();
            const serviceId = document.getElementById('serviceId').value.trim();

            try {
                const res = await fetch('/api/set-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newUrl, renderApiKey, serviceId })
                });
                const text = await res.text();
                alert(text);
                if(res.ok) {
                    cachedTermuxUrl = newUrl; // ローカルのキャッシュも更新
                }
            } catch (err) {
                alert('書き込みエラーが発生しました。');
            }
        }
    </script>
</body>
</html>
