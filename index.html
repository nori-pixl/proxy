<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Browser Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 20px; }
        .control-panel { margin-bottom: 15px; }
        input[type="text"] { width: 50%; padding: 10px; font-size: 16px; border-radius: 4px; border: none; outline: none; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .viewer-container { max-width: 1280px; margin: 0 auto; overflow: auto; border: 2px solid #444; background: #000; position: relative; }
        #screenView { width: 100%; height: auto; display: block; cursor: crosshair; min-height: 400px; background: #111; }
        .loading-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; font-size: 24px; color: #fff; }
    </style>
</head>
<body>

    <div class="control-panel">
        <input type="text" id="urlInput" placeholder="https://youtube.com" value="https://youtube.com">
        <button onclick="navigateUrl();">接続</button>
    </div>

    <div class="viewer-container">
        <!-- 💡 初期状態のダミー文字や壊れた画像アイコンを回避するため、最初はsrcを空にします -->
        <img id="screenView" alt="サイトに接続するとここに画面が映ります" onclick="sendClick(event);">
        <div class="loading-overlay" id="loading">読み書き中...</div>
    </div>

    <script>
        const screenView = document.getElementById('screenView');
        const loading = document.getElementById('loading');

        function toggleLoading(show) { 
            loading.style.display = show ? 'flex' : 'none'; 
        }

        // 💡 サイトへ接続して画面写真をRender経由でTermuxから取得する処理
        async function navigateUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            toggleLoading(true);

            try {
                // 💡 あなたのRenderのフルURLを明示して、確実に中継APIへPOSTします
                const res = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                if (!res.ok) throw new Error('サーバーエラー');
                
                const blob = await res.blob();
                screenView.src = URL.createObjectURL(blob); // 届いた画像データを画面に貼り付け
            } catch (err) {
                alert('Termuxへの接続、または画面の取得に失敗しました。Termuxの状況やTERMUX_URLを確認してください。');
            } finally {
                toggleLoading(false);
            }
        }

        // 💡 画面クリック時の代行処理
        async function sendClick(event) {
            if (!screenView.src || screenView.src === '') return;
            toggleLoading(true);

            const rect = screenView.getBoundingClientRect();
            const scaleX = 1280 / rect.width;
            const scaleY = 800 / rect.height;

            const clickX = Math.round((event.clientX - rect.left) * scaleX);
            const clickY = Math.round((event.clientY - rect.top) * scaleY);

            try {
                const res = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: clickX, y: clickY })
                });
                
                if (!res.ok) throw new Error('サーバーエラー');
                
                const blob = await res.blob();
                screenView.src = URL.createObjectURL(blob); // クリックして変化した最新画像に更新
            } catch (err) {
                console.error(err);
            } finally {
                toggleLoading(false);
            }
        }
    </script>
</body>
</html>
